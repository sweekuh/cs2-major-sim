[project]
name = "swiss-mc"
version = "0.1.0"
description = "Cologne 2026 Swiss Monte Carlo & Pick'Em Optimizer — pure compute core (Phase 1)"
requires-python = ">=3.12"
# numpy verified current 2.4.6 via `pip index versions numpy` (2026-05-28); pin the 2.4.x line.
# streamlit verified 1.57.0 still available via `pip index versions streamlit` (2026-05-29);
# pin the 1.57.x line per CLAUDE.md (1.58.0 is now current but the project pins 1.57.*).
# AppTest (streamlit.testing.v1) ships inside streamlit — no extra test dep.
# Phase 5 (05-03) adds httpx + python-dotenv — versions confirmed current on PyPI 2026-05-29
# (httpx 0.28.1, python-dotenv 1.2.2). These are CONFINED to odds/ + scripts/: httpx is
# lazy-imported only inside the providers' live-fetch branch and dotenv only inside
# scripts/fetch_odds.py — NEVER at the app/ui import path, so the zero-config first run is
# preserved (DX-01, ui/odds_loader.py is json-only).
dependencies = [
    "httpx>=0.28,<0.29",
    "numpy>=2.4,<2.5",
    "python-dotenv>=1.2,<2",
    "streamlit>=1.57,<1.58",
]

[dependency-groups]
# pytest verified current 9.0.3 via `pip index versions pytest` (2026-05-28).
# Research assumed 8.x [ASSUMED]; live check shows 9.x is now current — pin the confirmed line.
dev = [
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
# odds/ + scripts/ packaged so `python -m scripts.fetch_odds` resolves (the v2-cron entry).
packages = ["engine", "ui", "odds", "scripts"]
